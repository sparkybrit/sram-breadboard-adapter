# This board as a module of a larger schematic (Sparky1's): one KiCad symbol whose pins are its
# connector pins, read from this repo's schematic, through kicad-cli.
# Edit this file or the source, then `make -C module`; `make -C module check` fails if the
# symbol and the source disagree. module/interfaces/ and the .kicad_sym are generated.
# The keys are described in lib/kicad-tools/README.md.

library = "sram-breadboard-adapter"
keywords = "sparky1 module interface"

[SRAM_ADAPTER]
description = "8 MB SRAM breadboard adapter: eight LY62W10248 (1M x 8) in two banks of four. J0 address and control, J1 data"
repo = "https://github.com/sparkybrit/sram-breadboard-adapter"
path = ".."
schematic = "sram-breadboard-adaptor.kicad_sch"
connectors = ["J0", "J1"]
names = { J0 = "J0 address, control", J1 = "J1 data" }
# J0 and J1 run opposite ways along the long edges: +5V at the top of both, GND at the bottom.
sides = { left = ["J0"], right = ["J1:40-1"] }
